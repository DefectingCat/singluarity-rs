<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>singularity-rs</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #050811;
        color: #e0e6ed;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #050811;
        z-index: 9999;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }
      #loading-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255, 170, 34, 0.15);
        border-top: 3px solid #ffaa22;
        border-right: 3px solid #00d2ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        box-shadow: 0 0 15px rgba(255, 170, 34, 0.3);
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .title {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.25em;
        color: #f0f4f8;
        margin-bottom: 6px;
        text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
      }
      .status {
        font-size: 0.85rem;
        color: #8a9ba8;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="singularity-rs"
      data-type="main"
      data-cargo-features="bevy/webgpu"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue --enable-mutable-globals"
    />
    <!-- Ship the WESL shaders so Bevy's WasmAssetReader can fetch them at
         runtime (it requests `assets/shaders/*.wesl` over HTTP, matching the
         default AssetPlugin file_path of "assets"). Without this the shaders
         are absent from dist/ and every material loads a 404 fallback → grey
         screen. -->
    <link data-trunk rel="copy-dir" href="../assets" />
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="title">SINGULARITY</div>
      <div class="status" id="loading-status">Loading WebGPU Engine...</div>
    </div>
  </body>
</html>
