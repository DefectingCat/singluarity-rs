<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>singularity-rs</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #050811;
        color: #e0e6ed;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
        z-index: 9999;
        pointer-events: none;
      }
      /* Three short-axis widths of the opening view cover both wide and tall screens. */
      #loading-overlay img {
        position: absolute;
        width: 300vmin;
        height: 300vmin;
      }
    </style>
  </head>
  <body>
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="singularity-rs"
      data-type="main"
      data-cargo-features="bevy/webgpu"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue --enable-mutable-globals"
    />
    <!-- Ship the WESL shaders so Bevy's WasmAssetReader can fetch them at
         runtime (it requests `assets/shaders/*.wesl` over HTTP, matching the
         default AssetPlugin file_path of "assets"). Without this the shaders
         are absent from dist/ and every material loads a 404 fallback → grey
         screen. -->
    <link data-trunk rel="copy-dir" href="../assets" />
    <link data-trunk rel="copy-file" href="opening.webp" />
    <div id="loading-overlay" role="status" aria-label="Loading the black hole scene">
      <img src="opening.webp" alt="" fetchpriority="high" />
    </div>
  </body>
</html>
