services:
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./assets
          target: /app/assets
        - action: sync
          path: ./web
          target: /app/web
        - action: sync
          path: ./Trunk.toml
          target: /app/Trunk.toml
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Cargo.lock

volumes:
  cargo-registry:
  cargo-target:
