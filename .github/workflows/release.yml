name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release from Changelog
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md

  upload-desktop-assets:
    name: Build & Upload Desktop App (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies for Bevy and Packaging
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            squashfs-tools

      - name: Setup cargo-packager
        uses: crabnebula-dev/cargo-packager-action@v1

      - name: Package Desktop Application
        run: cargo packager --release --target ${{ matrix.target }}

      - name: Prepare macOS .app zip archive
        if: runner.os == 'macOS'
        run: |
          cd target/packager
          zip -r "Singularity_${{ matrix.target }}.app.zip" Singularity.app

      - name: Upload Desktop App Packages to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/packager/*.dmg
            target/packager/*.app.zip
            target/packager/*.deb
            target/packager/*.AppImage
            target/packager/*.exe
            target/packager/*.msi
          fail_on_unmatched_files: false
  upload-web-assets:
    name: Build & Upload Web Asset
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0

      - name: Build Web Target
        run: trunk build --release

      - name: Package Web Bundle
        run: |
          cd dist
          zip -r ../singularity-rs-web.zip .

      - name: Upload Web Bundle to Release
        uses: softprops/action-gh-release@v2
        with:
          files: singularity-rs-web.zip
