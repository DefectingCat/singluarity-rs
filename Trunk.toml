[build]
target = "web/index.html"
dist = "dist"

[serve]
address = "127.0.0.1"
port = 8080
open = false

[tools]
# Pin binaryen 131 (current). NOTE: no binaryen version accepts rustc's
# default wasm32 output without flags — neither rustc nor wasm-bindgen emits
# a `target_features` section for wasm-opt to auto-detect, so the validator
# falls back to MVP and rejects memory.copy/memory.fill/trunc_sat. The
# feature flags live in web/index.html `data-wasm-opt-params` (trunk appends
# them to the wasm-opt call); bumping the binaryen version alone does NOT
# fix validation — verified by CI run 30791573582 failing on version_131
# with zero flags, and reproduced locally.
wasm_opt = "version_131"
