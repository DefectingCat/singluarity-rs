[package]
name = "singularity-rs"
version = "0.2.2"
edition = "2024"

[package.metadata.packager]
identifier = "plus.rua.singularity"
product-name = "Singularity"
out-dir = "./target/packager"
icons = [
  "assets/icons/32x32.png",
  "assets/icons/128x128.png",
  "assets/icons/512x512.png",
  "assets/icons/icon.icns"
]


[[package.metadata.packager.binaries]]
path = "singularity-rs"
main = true

[lib]
name = "singularity_rs"
path = "src/lib.rs"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "bevy_core_pipeline",
  "bevy_render",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "bevy_winit",
  "bevy_asset",
  "bevy_text",
  "bevy_state",
  "bevy_color",
  "default_font",
  "png",
  "hdr",
  "webgpu",
] }
bevy_egui = "0.43"
bevy_asset_loader = "0.28"
# Release builds embed the shader assets. Debug builds load them from disk.
bevy_embedded_assets = "0.17"
bytemuck = { version = "1", features = ["derive"] }
rand = { version = "0.10", default-features = false }
rand_chacha = "0.10"

# Web-only deps for WebGPU detection + fallback message.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Gpu", "Navigator", "Window", "Document", "HtmlElement", "Element", "DomTokenList"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

# Desktop release tuning. This renderer is GPU-bound, but Bevy's CPU path
# (resource management, system scheduling, egui, wgpu command submission)
# still benefits measurably from cross-crate LTO and a single codegen unit:
# - lto = "fat": cross-crate inlining, removes trampolines through Bevy/wgpu.
# - codegen-units = 1: best optimization, at the cost of slower compiles.
# - panic = "abort": smaller binary, no unwind tables in the hot path.
# - strip: drop debug symbols from the shipped binary.
# `wasm-release` inherits release, so web picks these up too (then overrides
# opt-level to "z" for binary size).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Smaller wasm binary in release web builds (per Bevy examples README).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
